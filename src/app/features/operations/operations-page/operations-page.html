<a class="skip-link" href="#flight-list">Skip to flight list</a>

<div class="shell">
  <app-app-header
    [feedStatus]="loadStatus()"
    [showMenuButton]="isNarrow()"
    [menuOpen]="listOpen()"
    (menuToggle)="toggleList()"
  />

  <div
    class="body"
    [class.left-open]="listOpen()"
    [class.right-open]="!!selectedFlight() || notFound()"
  >
    <!-- LEFT: filters + flight list (drawer on tablet portrait) -->
    <aside id="flight-panel" class="panel left" aria-label="Search and flights">
      @if (isNarrow()) {
        <div class="drawer-bar">
          <button type="button" class="drawer-close" (click)="listOpen.set(false)">✕ Close</button>
        </div>
      }

      <section class="block">
        <app-flight-filters
          [flights]="flights()"
          [airports]="airports()"
          (filtersChange)="onFiltersChange($event)"
        />
      </section>

      <section class="block grow" id="flight-list" tabindex="-1">
        <app-flight-list
          [flights]="filteredFlights()"
          [total]="flights().length"
          [selectedId]="selectedId()"
          (flightSelect)="onFlightSelect($event)"
        />
      </section>
    </aside>

    <!-- CENTER: KPIs + map -->
    <main class="center">
      <section class="kpis" aria-label="Key metrics">
        <app-kpi-card label="Total flights" [value]="kpis().total" hint="Tracked today" />
        <app-kpi-card
          label="Active flights"
          tone="enroute"
          [value]="kpis().active"
          hint="Airborne now"
          [ratio]="ratio(kpis().active)"
        />
        <app-kpi-card
          label="Delayed flights"
          tone="delayed"
          [value]="kpis().delayed"
          [hint]="kpis().delayed ? 'Avg +' + kpis().avgDelayMinutes + ' min' : 'None'"
          [ratio]="ratio(kpis().delayed)"
        />
        <app-kpi-card
          label="Arrived flights"
          tone="arrived"
          [value]="kpis().arrived"
          hint="At gate"
          [ratio]="ratio(kpis().arrived)"
        />
      </section>

      <section class="map-area" aria-label="Flight map">
        <app-flight-map
          [flights]="mapFlights()"
          [airports]="airports()"
          [selectedId]="selectedId()"
          (flightSelect)="onFlightSelect($event)"
          (selectionClear)="clearSelection()"
        />

        <app-map-legend [counts]="statusCounts()" />

        <app-map-toolbar
          [playing]="playing()"
          [speed]="speed()"
          [elapsedMinutes]="elapsedMinutes()"
          (playToggle)="togglePlayback()"
          (resetPlayback)="resetPlayback()"
          (speedChange)="setSpeed($event)"
        />

        @if (loadStatus() === 'loading') {
          <div class="map-overlay" role="status">
            <div class="overlay-card">
              <span class="spinner" aria-hidden="true"></span>
              Loading flights…
            </div>
          </div>
        } @else if (loadStatus() === 'error') {
          <div class="map-overlay" role="alert">
            <div class="overlay-card">
              <strong>Couldn't load flight data</strong>
              <span class="muted">Check your connection and try again.</span>
              <button type="button" class="retry-btn" (click)="retry()">Retry</button>
            </div>
          </div>
        }
      </section>
    </main>

    <!-- RIGHT: details + needs attention (drawer below 1280px) -->
    <aside class="panel right" aria-label="Flight details">
      <section class="block" aria-live="polite">
        @if (selectedFlight(); as flight) {
          <app-flight-details
            [flight]="flight"
            [origin]="airportsByCode().get(flight.origin)"
            [destination]="airportsByCode().get(flight.destination)"
            (closeDetails)="clearSelection()"
          />
        } @else if (notFound()) {
          <app-empty-state
            icon="⚠"
            heading="Flight not found"
            message="This flight isn't in the current feed. The link may be out of date."
          />
        } @else {
          <app-empty-state
            heading="No flight selected"
            message="Pick an aircraft on the map or a row in the flight list to see its route, schedule and aircraft details."
          />
        }
      </section>

      <section class="block">
        <app-attention-list [flights]="attention()" (flightSelect)="onFlightSelect($event)" />
      </section>
    </aside>

    <!-- Dark backdrop behind open drawers (tablet only) -->
    <div class="scrim" aria-hidden="true" (click)="closeDrawers()"></div>
  </div>
</div>
