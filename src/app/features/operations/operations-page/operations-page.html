<a class="skip-link" href="#flight-list">Skip to flight list</a>

<div class="shell">
  <app-app-header />

  <div class="body">
    <!-- LEFT: filters + flight list -->
    <aside class="panel left" aria-label="Search and flights">
      <section class="block">
        <h2 class="block-title">Search &amp; filters</h2>
        <div class="placeholder">Filters go here</div>
      </section>
      <section class="block grow" id="flight-list" tabindex="-1">
        <h2 class="block-title">Flights</h2>
        <div class="placeholder">Flight list goes here</div>
      </section>
    </aside>

    <!-- CENTER: KPIs + map -->
    <main class="center">
      <div class="kpis">
        <div class="placeholder">Total</div>
        <div class="placeholder">Active</div>
        <div class="placeholder">Delayed</div>
        <div class="placeholder">Arrived</div>
      </div>
      <section class="map-area" aria-label="Flight map">
        <app-flight-map
          [flights]="flights()"
          [airports]="airports()"
          [selectedId]="selectedId()"
          (flightSelect)="onFlightSelect($event)"
          (selectionClear)="clearSelection()"
        />
      </section>
    </main>

    <!-- RIGHT: details + needs attention -->
    <aside class="panel right" aria-label="Flight details">
      <!-- RIGHT panel, first block -->
      <section class="block" aria-live="polite">
        @if (selectedFlight(); as flight) {
          <app-flight-details
            [flight]="flight"
            [origin]="airportsByCode().get(flight.origin)"
            [destination]="airportsByCode().get(flight.destination)"
            (closeDetails)="clearSelection()"
          />
        } @else if (notFound()) {
          <app-empty-state
            icon="⚠"
            heading="Flight not found"
            message="This flight isn't in the current feed. The link may be out of date."
          />
        } @else {
          <app-empty-state
            heading="No flight selected"
            message="Pick an aircraft on the map or a row in the flight list to see its route, schedule and aircraft details."
          />
        }
      </section>
      <section class="block">
        <h2 class="block-title">Needs attention</h2>
        <div class="placeholder">Delayed flights go here</div>
      </section>
    </aside>
  </div>
</div>
