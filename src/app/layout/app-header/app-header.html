<header class="header">
  <div class="brand">
    <span class="logo" aria-hidden="true">✈</span>
    <div>
      <div class="brand-name">Flightdeck</div>
      <div class="brand-sub">Operations console</div>
    </div>
  </div>

  <div class="divider" aria-hidden="true"></div>

  <div class="context">
    <div class="context-title">Live traffic</div>
    <div class="context-sub">India · domestic sector</div>
  </div>

  <div class="spacer"></div>

  <span class="feed-pill"><span class="dot" aria-hidden="true"></span>Mock feed · connected</span>

  <div class="clock mono" aria-label="Current time">
    <div class="clock-main">--:-- IST</div>
    <div class="clock-sub">--:--Z</div>
  </div>

  <button class="icon-btn" type="button" aria-label="Toggle color theme">☀</button>
</header>
