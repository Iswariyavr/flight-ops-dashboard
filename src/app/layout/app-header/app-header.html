<header class="header">
  @if (showMenuButton()) {
    <button
      type="button"
      class="icon-btn menu-btn"
      aria-controls="flight-panel"
      [attr.aria-expanded]="menuOpen()"
      (click)="menuToggle.emit()"
    >
      ☰ <span class="menu-label">Flights</span>
    </button>
  }

  <div class="brand">
    <span class="logo" aria-hidden="true">✈</span>
    <div>
      <div class="brand-name">Flightdeck</div>
      <div class="brand-sub">Operations console</div>
    </div>
  </div>

  <div class="divider" aria-hidden="true"></div>

  <div class="context">
    <div class="context-title">Live traffic</div>
    <div class="context-sub">India · domestic sector</div>
  </div>

  <div class="spacer"></div>

  <span class="feed-pill" [class]="'is-' + feedStatus()" role="status">
    <span class="dot" aria-hidden="true"></span>{{ feedLabel() }}
  </span>

  <div class="clock mono">
    <time class="clock-main" [attr.datetime]="now().toISOString()">
      {{ now() | date: 'HH:mm' : '+0530' }} IST
    </time>
    <div class="clock-sub">{{ now() | date: 'HH:mm' : 'UTC' }}Z</div>
  </div>

  <button
    type="button"
    class="icon-btn"
    [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
    (click)="theme.toggle()"
  >
    {{ theme.theme() === 'dark' ? '☀' : '☾' }}
  </button>
</header>
