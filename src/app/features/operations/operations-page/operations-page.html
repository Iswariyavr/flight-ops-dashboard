<a class="skip-link" href="#flight-list">Skip to flight list</a>

<div class="shell">
  <app-app-header />

  <div class="body">
    <!-- LEFT: filters + flight list -->
    <aside class="panel left" aria-label="Search and flights">
      <section class="block">
        <app-flight-filters
          [flights]="flights()"
          [airports]="airports()"
          (filtersChange)="onFiltersChange($event)"
        />
      </section>

      <section class="block grow" id="flight-list" tabindex="-1">
        <app-flight-list
          [flights]="filteredFlights()"
          [total]="flights().length"
          [selectedId]="selectedId()"
          (flightSelect)="onFlightSelect($event)"
        />
      </section>
    </aside>

    <!-- CENTER: KPIs + map -->
    <main class="center">
      <section class="kpis" aria-label="Key metrics">
        <app-kpi-card label="Total flights" [value]="kpis().total" hint="Tracked today" />
        <app-kpi-card
          label="Active flights"
          tone="enroute"
          [value]="kpis().active"
          hint="Airborne now"
          [ratio]="ratio(kpis().active)"
        />
        <app-kpi-card
          label="Delayed flights"
          tone="delayed"
          [value]="kpis().delayed"
          [hint]="kpis().delayed ? 'Avg +' + kpis().avgDelayMinutes + ' min' : 'None'"
          [ratio]="ratio(kpis().delayed)"
        />
        <app-kpi-card
          label="Arrived flights"
          tone="arrived"
          [value]="kpis().arrived"
          hint="At gate"
          [ratio]="ratio(kpis().arrived)"
        />
      </section>

      <section class="map-area" aria-label="Flight map">
        <app-flight-map
          [flights]="mapFlights()"
          [airports]="airports()"
          [selectedId]="selectedId()"
          (flightSelect)="onFlightSelect($event)"
          (selectionClear)="clearSelection()"
        />
      </section>
    </main>

    <!-- RIGHT: details + needs attention -->
    <aside class="panel right" aria-label="Flight details">
      <section class="block" aria-live="polite">
        @if (selectedFlight(); as flight) {
          <app-flight-details
            [flight]="flight"
            [origin]="airportsByCode().get(flight.origin)"
            [destination]="airportsByCode().get(flight.destination)"
            (closeDetails)="clearSelection()"
          />
        } @else if (notFound()) {
          <app-empty-state
            icon="⚠"
            heading="Flight not found"
            message="This flight isn't in the current feed. The link may be out of date."
          />
        } @else {
          <app-empty-state
            heading="No flight selected"
            message="Pick an aircraft on the map or a row in the flight list to see its route, schedule and aircraft details."
          />
        }
      </section>

      <section class="block">
        <app-attention-list [flights]="attention()" (flightSelect)="onFlightSelect($event)" />
      </section>
    </aside>
  </div>
</div>
